services:
  # Web Service running Dockerized ShopSense AI
  - type: web
    name: shopsense-ai-service
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: shopsense-postgres
          property: connectionString

# Cloud Managed PostgreSQL Database
databases:
  - name: shopsense-postgres
    databaseName: shopsense_db
    user: shopsense_user
    plan: free
    region: oregon
