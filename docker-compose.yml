version: '3.8'

services:
  # ShopSense Fullstack Application (Express API + Vite React Frontend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopsense-ai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://shopsense_user:shopsense_secure_pass@postgres:5432/shopsense_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shopsense-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Managed PostgreSQL 16 Database with persistent volume
  postgres:
    image: postgres:16-alpine
    container_name: shopsense-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: shopsense_db
      POSTGRES_USER: shopsense_user
      POSTGRES_PASSWORD: shopsense_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shopsense-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsense_user -d shopsense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shopsense-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
